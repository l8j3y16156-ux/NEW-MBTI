<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="일상 속 16가지 선택으로 내 안에 숨어있는 동물을 만나보세요.">
  <meta name="theme-color" content="#0d1d36">
  <title>내 안에 숨어있는 동물</title>
  <style>
:root {
  color-scheme: dark;
  --background: #0d1d36;
  --paper: #142a47;
  --ink: #fff8e9;
  --muted: #c2d8ee;
  --accent: #bce7ff;
  --accent-hover: #e3f6ff;
  --accent-ink: #0f2843;
  --gold: #ffe0a0;
  --mist: #203c5c;
  --border: #466485;
  --answer-surface: #172f4d;
  font-family: system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 58% 0%, #264d76, var(--background) 57%) fixed; color: var(--ink); }
button, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
h1, h2, h3, p { margin: 0; }

.page-width { width: min(1080px, calc(100% - 64px)); margin-inline: auto; }
.site-header, .site-footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.site-header { padding-block: 28px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-size: .88rem; font-weight: 750; }
.brand-icon { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid var(--border); border-radius: 50%; color: var(--gold); background: var(--mist); }
.edition { color: var(--muted); font-size: .68rem; font-weight: 700; letter-spacing: .14em; }
.site-footer { padding-block: 24px; color: var(--muted); font-size: .76rem; }
.panel { background: linear-gradient(150deg, #1f3b5d, var(--paper) 58%); border: 1px solid var(--border); border-radius: 28px; box-shadow: 0 18px 50px #050d2070; }
.welcome { min-height: 530px; display: grid; grid-template-columns: 1.16fr 1fr; overflow: hidden; }
.welcome-copy { padding: clamp(32px, 5.3vw, 68px); align-self: center; }
.eyebrow { color: var(--gold); font-size: .79rem; font-weight: 800; letter-spacing: .075em; }
.welcome .eyebrow { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border: 1px solid var(--border); border-radius: 999px; background: var(--mist); }
.welcome .eyebrow span { width: 6px; height: 6px; transform: rotate(45deg); background: var(--gold); }
.welcome h1 { margin-top: 19px; font-size: clamp(2.25rem, 5.4vw, 4.35rem); line-height: 1.13; letter-spacing: -.085em; word-break: keep-all; }
.welcome h1, .result h1 { font-family: "Batang", "AppleMyungjo", "Noto Serif KR", serif; }
.welcome h1 em { font-style: normal; color: var(--gold); text-shadow: 0 0 28px #f5bc6440; }
.intro { margin-top: 22px; font-size: .98rem; line-height: 1.8; color: var(--muted); word-break: keep-all; }
.facts { display: flex; gap: 9px 14px; flex-wrap: wrap; color: var(--muted); font-size: .78rem; font-weight: 650; margin: 22px 0 26px; }
.facts span { display: inline-flex; align-items: center; gap: 7px; }
.facts span::before { content: ""; width: 4px; height: 4px; transform: rotate(45deg); background: var(--gold); }
.welcome-actions, .quiz-actions, .result-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 13px; min-height: 46px; padding: 11px 18px; border: 1px solid transparent; border-radius: 11px; font-size: .93rem; font-weight: 750; transition: background-color .15s, border-color .15s; }
.primary { background: var(--accent); color: var(--accent-ink); }
.primary:hover:not(:disabled) { background: var(--accent-hover); }
.primary:disabled { background: var(--mist); color: var(--muted); }
.secondary { background: var(--paper); border-color: var(--border); color: var(--accent); }
.secondary:hover { background: var(--mist); }
.text-button { color: var(--accent); background: transparent; border: 0; padding: 11px 8px; text-decoration: underline; text-underline-offset: 4px; font-weight: 700; }

.forest { position: relative; isolation: isolate; min-width: 0; background: radial-gradient(ellipse at 54% 68%, #75aecf 0%, #3e709a 35%, #203e66 65%, #152746 100%); overflow: hidden; }
.forest::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(circle at 15% 23%, #fff1cd 1px, transparent 2px), radial-gradient(circle at 82% 18%, #d7f3ff 1px, transparent 2px), radial-gradient(circle at 27% 47%, #fff1cd 1.5px, transparent 3px), radial-gradient(circle at 75% 37%, #d7f3ff 1.5px, transparent 3px), radial-gradient(circle at 12% 63%, #fff1cd 1px, transparent 3px), radial-gradient(circle at 87% 58%, #fff1cd 1px, transparent 3px); }
.forest::after { content: ""; position: absolute; inset: auto -12% -11% -12%; height: 33%; border-radius: 50% 55% 0 0; background: linear-gradient(#173657, #102440 65%); }
.forest-moon { position: absolute; top: 17%; left: 50%; width: clamp(110px, 45%, 186px); aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle at 27% 69%, #9ec5dc5e 9%, transparent 10%), radial-gradient(circle at 67% 28%, #9ec5dc4d 15%, transparent 16%), linear-gradient(145deg, #fff4d6, #c5e9fb 76%); box-shadow: 0 0 65px #a3e0ff91; }
.forest-moon::after { content: ""; position: absolute; inset: -13%; border: 1px dashed #dbf2ff85; border-radius: 50%; }
.forest-tree { position: absolute; bottom: 14%; width: 34%; height: 56%; background: #1c3e60; clip-path: polygon(50% 0, 68% 31%, 59% 29%, 82% 57%, 70% 54%, 100% 91%, 56% 91%, 56% 100%, 44% 100%, 44% 91%, 0 91%, 30% 54%, 18% 57%, 41% 29%, 32% 31%); }
.forest-hill { position: absolute; inset: auto -22% 6% -15%; height: 38%; border-radius: 48% 74% 0 0; background: linear-gradient(160deg, #5f98b8, #345d80 68%); transform: rotate(-7deg); }
.forest-tree-distant { left: 8%; bottom: 23%; width: 23%; height: 43%; background: #315879; }
.forest-tree-middle { right: 5%; bottom: 20%; width: 25%; height: 47%; background: #294c6d; }
.forest-tree-left { left: -9%; }
.forest-tree-right { right: -10%; bottom: 13%; height: 63%; background: #142e4d; }
.forest-fireflies { position: absolute; z-index: 1; inset: 0; pointer-events: none; background:
  radial-gradient(circle at 23% 70%, #fff3be 1.5px, #ffe2a277 3px, transparent 8px),
  radial-gradient(circle at 33% 79%, #fff3be 1px, #ffe2a277 3px, transparent 6px),
  radial-gradient(circle at 74% 72%, #fff3be 1.5px, #ffe2a277 3px, transparent 9px),
  radial-gradient(circle at 82% 62%, #fff3be 1px, #ffe2a277 2px, transparent 7px); }
.forest-sparkle { position: absolute; color: var(--gold); text-shadow: 0 0 16px #ffe0a0; }
.forest-sparkle-left { top: 28%; left: 18%; }
.forest-sparkle-right { top: 36%; right: 16%; font-size: 1.3rem; }
.forest-animal { position: absolute; z-index: 1; left: 50%; top: 60%; transform: translate(-50%, -50%) rotate(-6deg); font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif; font-size: clamp(5.5rem, 13vw, 9rem); line-height: 1.25; filter: drop-shadow(0 16px 14px #0b223f9c); }
.forest-label { position: absolute; z-index: 1; bottom: 26px; left: 50%; transform: translateX(-50%); white-space: nowrap; border-radius: 999px; padding: 7px 13px; color: var(--gold); border: 1px solid #a8d7f064; font-weight: 650; font-size: .73rem; background: #102b48; }

.inner-panel { width: min(100%, 780px); margin-inline: auto; padding: clamp(20px, 5vw, 48px); }
.progress-heading, .quiz-actions { display: flex; justify-content: space-between; align-items: center; }
.progress-heading { color: var(--accent); font-size: .82rem; font-weight: 750; }
progress { display: block; appearance: none; width: 100%; height: 8px; margin-top: 9px; border: 0; border-radius: 999px; overflow: hidden; background: var(--mist); }
progress::-webkit-progress-bar { background: var(--mist); }
progress::-webkit-progress-value { background: linear-gradient(90deg, #8ad2f8, var(--gold)); border-radius: 999px; }
progress::-moz-progress-bar { background: linear-gradient(90deg, #8ad2f8, var(--gold)); border-radius: 999px; }
.question-number { margin-top: 26px; font-weight: 800; letter-spacing: .08em; font-size: .78rem; color: var(--accent); }
.quiz h1, .result h1 { margin-top: 8px; font-size: clamp(1.45rem, 4vw, 2.1rem); line-height: 1.37; letter-spacing: -.045em; word-break: keep-all; }
.question-help { margin-top: 10px; color: var(--muted); font-size: .88rem; line-height: 1.5; }
.answers { min-inline-size: 0; display: grid; gap: 10px; padding: 0; margin: 21px 0 24px; border: 0; }
.answer-group { border: 1px solid var(--border); border-radius: 14px; padding: 13px; background: var(--answer-surface); }
.answer-group:has(input:checked) { border-color: #94c9ea; background: var(--mist); }
.answer-text { font-size: .93rem; line-height: 1.55; font-weight: 650; }
.choice-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 9px; }
.choice { display: block; cursor: pointer; position: relative; }
.choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.choice span { display: grid; place-items: center; text-align: center; min-height: 44px; padding: 6px 4px; border: 1px solid var(--border); border-radius: 8px; background: var(--paper); color: var(--accent); font-size: .84rem; font-weight: 700; }
.choice:hover span { border-color: var(--accent); }
.choice input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.choice input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 2px; }

.result-hero { text-align: center; padding: 28px 14px 25px; background: radial-gradient(circle at 14% 24%, #ffe0a0 1px, transparent 2px), radial-gradient(circle at 84% 30%, #bce7ff 1px, transparent 2px), radial-gradient(circle at 24% 54%, #bce7ff 1px, transparent 2px), radial-gradient(circle at 76% 64%, #ffe0a0 1px, transparent 2px), radial-gradient(ellipse at 50% 30%, #2a5274, var(--answer-surface) 70%); border: 1px solid var(--border); border-radius: 20px; }
.result-emoji { display: grid; place-items: center; width: 106px; height: 106px; margin: 16px auto 8px; border: 1px solid #d0ecff73; border-radius: 50%; background: #98d6fc29; box-shadow: 0 0 30px #ace4ff52; font: 4.25rem/1.18 "Segoe UI Emoji", "Apple Color Emoji", sans-serif; }
.type-badge { display: inline-block; margin-top: 9px; padding: 4px 9px; background: var(--mist); border: 1px solid var(--border); border-radius: 999px; color: var(--gold); font-size: .76rem; font-weight: 800; letter-spacing: .13em; }
.result-summary { width: min(100%, 450px); margin: 12px auto 0; color: var(--muted); line-height: 1.7; word-break: keep-all; }
.result-body > h2 { margin: 26px 0 11px; }
.result-body h2 { font-size: 1.06rem; letter-spacing: -.025em; }
.axis-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
.axis-card { padding: 13px; border: 1px solid var(--border); border-radius: 12px; }
.axis-card h3 { font-size: .91rem; }
.axis-card p, .evidence p, .reflection p { margin-top: 6px; color: var(--muted); font-size: .89rem; line-height: 1.6; }
.evidence { margin-top: 22px; }
.evidence blockquote { margin: 9px 0; padding: 2px 0 2px 11px; border-left: 3px solid #83b5d8; }
.evidence blockquote p { margin: 0; }
.evidence blockquote p + p { margin-top: 3px; font-weight: 650; }
.reflection { margin: 20px 0; border-radius: 12px; padding: 14px; background: var(--mist); }
.share-status, .share-fallback, .noscript { margin-top: 12px; color: var(--muted); font-size: .85rem; }
.share-fallback textarea { display: block; width: 100%; margin-top: 6px; border: 1px solid var(--border); border-radius: 8px; padding: 8px; resize: vertical; background: var(--answer-surface); color: var(--ink); }

@media (max-width: 760px) {
  .page-width { width: min(100% - 32px, 520px); }
  .site-header { padding-block: 16px; }
  .edition { display: none; }
  .panel { border-radius: 20px; }
  .welcome { grid-template-columns: 1fr; min-height: 0; }
  .forest { order: -1; height: 210px; }
  .forest-moon { top: 12%; width: 108px; }
  .forest-animal { top: 61%; font-size: 5rem; }
  .forest-label { bottom: 10px; font-size: .65rem; padding: 5px 9px; }
  .welcome-copy { padding: 23px; }
  .welcome h1 { margin-top: 11px; }
  .intro { margin-top: 13px; }
  .desktop-break { display: none; }
  .facts { margin: 14px 0 17px; }
  .site-footer { flex-wrap: wrap; gap: 6px 12px; padding-block: 16px; }
}

@media (max-width: 450px) {
  .axis-grid { grid-template-columns: 1fr; }
  .quiz-actions .button, .result-actions .button { padding-inline: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  .button { transition: none; }
}
  </style>
</head>
<body>
  <header class="site-header page-width">
    <span class="brand"><span class="brand-icon" aria-hidden="true">✦</span> 달빛 성향 탐험</span>
    <span class="edition">MOONLIT ANIMAL TEST</span>
  </header>

  <main class="page-width">
    <section class="welcome panel" id="welcome" aria-labelledby="welcome-title">
      <div class="welcome-copy">
        <p class="eyebrow"><span aria-hidden="true"></span> MBTI 성향 테스트</p>
        <h1 id="welcome-title" tabindex="-1">내 안에 숨어있는<br><em>동물</em></h1>
        <p class="intro">쉬는 날의 모습부터 친구와 의견이 다를 때까지.<br class="desktop-break"> 일상 속 선택으로 나와 닮은 동물을 만나보세요.</p>
        <div class="facts"><span>16개 질문</span><span>약 3분</span><span>16가지 동물</span></div>
        <div class="welcome-actions">
          <button type="button" class="button primary" id="start">테스트 시작 <span aria-hidden="true">→</span></button>
          <button type="button" class="button secondary" id="resume" hidden>이어하기 <span aria-hidden="true">→</span></button>
          <button type="button" class="text-button" id="latest" hidden>최근 결과 보기</button>
        </div>
      </div>
      <div class="forest" aria-hidden="true">
        <span class="forest-moon"></span>
        <span class="forest-hill"></span>
        <span class="forest-tree forest-tree-distant"></span>
        <span class="forest-tree forest-tree-middle"></span>
        <span class="forest-tree forest-tree-left"></span>
        <span class="forest-tree forest-tree-right"></span>
        <span class="forest-sparkle forest-sparkle-left">✧</span>
        <span class="forest-sparkle forest-sparkle-right">✦</span>
        <span class="forest-fireflies"></span>
        <div class="forest-animal">🦊</div>
        <span class="forest-label">✧ &nbsp; 달빛 아래, 나를 만나는 숲</span>
      </div>
    </section>

    <section class="quiz panel inner-panel" id="quiz" aria-labelledby="question-title" hidden>
      <div class="progress-heading"><span class="eyebrow">나를 알아가는 중</span><span id="progress-count"></span></div>
      <progress id="progress-bar" max="16" value="0" aria-label="응답한 문항 수"></progress>
      <p class="question-number" id="question-number"></p>
      <h1 id="question-title" tabindex="-1"></h1>
      <p class="question-help" id="question-help">평소의 나와 더 가까운 반응을 골라주세요.</p>
      <fieldset class="answers" aria-labelledby="question-title" aria-describedby="question-help">
        <div class="answer-group" role="group" aria-labelledby="option-a">
          <p class="answer-text" id="option-a"></p>
          <div class="choice-row">
            <label class="choice"><input type="radio" name="answer" value="0" aria-labelledby="option-a a-strong"><span id="a-strong">많이 가까워요</span></label>
            <label class="choice"><input type="radio" name="answer" value="1" aria-labelledby="option-a a-slight"><span id="a-slight">조금 가까워요</span></label>
          </div>
        </div>
        <div class="answer-group" role="group" aria-labelledby="option-b">
          <p class="answer-text" id="option-b"></p>
          <div class="choice-row">
            <label class="choice"><input type="radio" name="answer" value="2" aria-labelledby="option-b b-slight"><span id="b-slight">조금 가까워요</span></label>
            <label class="choice"><input type="radio" name="answer" value="3" aria-labelledby="option-b b-strong"><span id="b-strong">많이 가까워요</span></label>
          </div>
        </div>
      </fieldset>
      <div class="quiz-actions">
        <button type="button" class="button secondary" id="back"></button>
        <button type="button" class="button primary" id="next" disabled></button>
      </div>
    </section>

    <section class="result panel inner-panel" id="result" aria-labelledby="result-title" hidden>
      <div class="result-hero">
        <p class="eyebrow">나의 동물 유형</p>
        <div class="result-emoji" id="result-emoji" aria-hidden="true"></div>
        <h1 id="result-title" tabindex="-1"></h1>
        <p class="type-badge" id="result-type"></p>
        <p class="result-summary" id="result-summary"></p>
      </div>
      <div class="result-body">
        <h2>네 가지 성향으로 본 나</h2>
        <div class="axis-grid" id="axis-grid"></div>
        <section class="evidence">
          <h2>내 답변에서 발견한 모습</h2>
          <div id="answer-evidence"></div>
        </section>
        <div class="reflection"><h2>나를 돌아보는 질문</h2><p id="reflection"></p></div>
        <div class="result-actions">
          <button type="button" class="button primary" id="share">결과 공유하기 <span aria-hidden="true">↗</span></button>
          <button type="button" class="button secondary" id="restart">다시 하기</button>
        </div>
        <p class="share-status" id="share-status" role="status" hidden></p>
        <label class="share-fallback" id="share-fallback" hidden>공유할 결과 문구<textarea id="share-text" rows="4" readonly></textarea></label>
      </div>
    </section>

    <noscript><p class="noscript">테스트를 시작하려면 브라우저에서 JavaScript를 켜주세요.</p></noscript>
  </main>

  <footer class="site-footer page-width"><span>✦ &nbsp; 내 안에 숨어있는 동물</span><span>일상 속 나를 돌아보는 성향 테스트</span></footer>
  <script>
const questions = [
  {"axis":"EI","prompt":"즐거운 모임을 마치고 집에 돌아왔어요. 남은 저녁은 어떻게 보내고 싶나요?","left":"편한 친구와 통화하며 이야기를 더 나누고 싶어요.","leftPole":"E","right":"좋아하는 음악을 틀고 조용히 쉬고 싶어요."},
  {"axis":"SN","prompt":"처음 가본 동네가 마음에 들었어요. 나중에 그곳을 떠올리면 무엇이 먼저 생각나나요?","left":"그곳의 분위기와 다른 계절에 가면 어떨지 떠올라요.","leftPole":"N","right":"걸었던 길이나 기억에 남은 가게가 떠올라요."},
  {"axis":"TF","prompt":"친구 둘이 다음 모임 장소를 두고 의견이 달라요. 무엇부터 살펴보나요?","left":"이동 시간과 비용을 비교해 어떤 선택이 더 합리적인지 살펴요.","leftPole":"T","right":"각자 그 장소를 고른 이유와 어떤 점을 중요하게 여기는지 들어봐요."},
  {"axis":"JP","prompt":"주말에 한 번도 가본 적 없는 동네로 놀러 가요. 전날에는 무엇을 준비하나요?","left":"가고 싶은 곳 몇 군데를 알아두고, 순서는 현장에서 정해요.","leftPole":"P","right":"꼭 들를 곳을 고르고, 대략적인 순서까지 정해둬요."},

const storageKey = 'hidden-animal-test-v1';
const choiceWeights = [2, 1, 1, 2];
const byId = id => document.getElementById(id);
const screens = ['welcome', 'quiz', 'result'];
const choices = Array.from(document.querySelectorAll('input[name="answer"]'));

let state = readState();
let currentResult;

function validAnswers(value) {
  return Array.isArray(value) && value.length === questions.length && value.every(
    answer => answer === null || (Number.isInteger(answer) && answer >= 0 && answer < choiceWeights.length)
  );
}

function readState() {
  let saved;
  try {
    saved = JSON.parse(localStorage.getItem(storageKey));
  } catch {
    // A browser can limit storage for a locally opened file.
  }
  const draft = saved?.draft;
  const latest = saved?.latest;
  return {
    draft: validAnswers(draft?.answers) && Number.isInteger(draft.index) &&
      draft.index >= 0 && draft.index < questions.length ? draft : null,
    latest: validAnswers(latest) && latest.every(answer => answer !== null) ? latest : null,
  };
}

function saveState() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(state));
  } catch {
    // The current test can continue in memory when storage is unavailable.
  }
}

function show(screen, heading, focus = true) {
  for (const name of screens) byId(name).hidden = name !== screen;
  if (focus) {
    byId(heading).focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }
}

function showWelcome(focus = true) {
  byId('resume').hidden = !state.draft;
  byId('latest').hidden = !state.latest;
  byId('start').firstChild.textContent = state.draft ? '새로 시작 ' : '테스트 시작 ';
  show('welcome', 'welcome-title', focus);
}

function startTest() {
  state.draft = { index: 0, answers: Array(questions.length).fill(null) };
  saveState();
  showQuestion();
}

function updateProgress() {
  const answered = state.draft.answers.filter(answer => answer !== null).length;
  byId('progress-bar').value = answered;
  byId('progress-count').textContent = `응답 ${answered} / ${questions.length}`;
}

function showQuestion() {
  const { index, answers } = state.draft;
  const question = questions[index];
  byId('question-number').textContent = `질문 ${index + 1} / ${questions.length}`;
  byId('question-title').textContent = question.prompt;
  byId('option-a').textContent = question.left;
  byId('option-b').textContent = question.right;
  for (const choice of choices) choice.checked = Number(choice.value) === answers[index];
  byId('back').textContent = index === 0 ? '처음 화면' : '← 이전';
  byId('next').textContent = index === questions.length - 1 ? '결과 보기 →' : '다음 →';
  byId('next').disabled = answers[index] === null;
  updateProgress();
  show('quiz', 'question-title');
}

function scoreAnswers(answers) {
  const observations = questions.map((question, index) => {
    const answer = answers[index];
    const choseLeft = answer < 2;
    const rightPole = question.leftPole === question.axis[0] ? question.axis[1] : question.axis[0];
    return {
      question,
      index,
      pole: choseLeft ? question.leftPole : rightPole,
      weight: choiceWeights[answer],
      response: choseLeft ? question.left : question.right,
    };
  });

  const scores = axes.map(axis => {
    const entries = observations.filter(entry => entry.question.axis === axis.id);
    const score = entries.reduce((sum, entry) => (
      sum + (entry.pole === axis.id[0] ? -entry.weight : entry.weight)
    ), 0);
    // The first question of each axis serves as the representative tie-breaker.
    const pole = score === 0 ? entries[0].pole : axis.id[score > 0 ? 1 : 0];
    return { axis, entries, score, pole };
  });

  const type = scores.map(score => score.pole).join('');
  return { type, scores, animal: animals[type] };
}

function axisDescription({ axis, score }) {
  if (score === 0) return `${axis.mixed} 이번 답변에서는 두 반응이 비슷하게 나타났어요.`;
  const direction = score < 0 ? 'left' : 'right';
  if (Math.abs(score) > 2) return axis[direction];
  return `${axis.mixed} 답변을 종합하면 ‘${axis[`${direction}Label`]}’ 쪽으로 조금 기울었어요.`;
}

function strongestAnswer(entries, pole) {
  return entries.filter(entry => entry.pole === pole).sort(
    (first, second) => second.weight - first.weight || first.index - second.index
  )[0];
}

function addEvidence(parent, entry) {
  const block = document.createElement('blockquote');
  const prompt = document.createElement('p');
  const response = document.createElement('p');
  prompt.textContent = entry.question.prompt;
  response.textContent = `“${entry.response}”`;
  block.append(prompt, response);
  parent.append(block);
}

function showResult(answers) {
  currentResult = scoreAnswers(answers);
  const { type, scores, animal } = currentResult;
  const lastSyllable = animal.name.charCodeAt(animal.name.length - 1);
  const ending = (lastSyllable - 0xac00) % 28 === 0 ? '예요' : '이에요';
  byId('result-title').textContent = `당신 안에 숨어 있는 동물은 ${animal.name}${ending}`;
  byId('result-emoji').textContent = animal.emoji;
  byId('result-type').textContent = type;
  byId('result-summary').textContent = animal.summary;
  byId('reflection').textContent = animal.reflection;

  const cards = byId('axis-grid');
  cards.replaceChildren();
  for (const score of scores) {
    const card = document.createElement('div');
    const heading = document.createElement('h3');
    const description = document.createElement('p');
    card.className = 'axis-card';
    heading.textContent = score.axis.label;
    description.textContent = axisDescription(score);
    card.append(heading, description);
    cards.append(card);
  }

  const evidence = byId('answer-evidence');
  evidence.replaceChildren();
  const strongest = scores.filter(score => score.score !== 0).sort(
    (first, second) => Math.abs(second.score) - Math.abs(first.score)
  ).slice(0, 2);
  if (strongest.length) {
    for (const { entries, pole } of strongest) addEvidence(evidence, strongestAnswer(entries, pole));
  } else {
    const note = document.createElement('p');
    note.textContent = '상황에 따라 서로 다른 반응을 골랐어요. 에너지를 되찾는 방식에서 두 모습을 살펴볼 수 있어요.';
    evidence.append(note);
    for (const pole of scores[0].axis.id) addEvidence(evidence, strongestAnswer(scores[0].entries, pole));
  }

  byId('share-status').hidden = true;
  byId('share-fallback').hidden = true;
  show('result', 'result-title');
}

async function shareResult() {
  const button = byId('share');
  const status = byId('share-status');
  const { type, animal } = currentResult;
  const title = '내 안에 숨어있는 동물';
  const text = `${title}\n${animal.emoji} ${animal.name} (${type})\n${animal.summary}`;
  const url = /^https?:$/.test(location.protocol) ? new URL(location.pathname, location.origin).href : '';
  const copyText = url ? `${text}\n${url}` : text;
  button.disabled = true;
  status.hidden = true;
  byId('share-fallback').hidden = true;

  try {
    if (navigator.share) {
      try {
        await navigator.share(url ? { title, text, url } : { title, text });
        return;
      } catch (error) {
        if (error.name === 'AbortError') return;
      }
    }
    try {
      await navigator.clipboard.writeText(copyText);
      status.textContent = '결과를 복사했어요. 원하는 곳에 붙여넣어 공유해 보세요.';
      status.hidden = false;
    } catch {
      byId('share-fallback').hidden = false;
      const field = byId('share-text');
      field.value = copyText;
      field.focus();
      field.select();
      status.textContent = '아래 결과 문구를 복사해 공유할 수 있어요.';
      status.hidden = false;
    }
  } finally {
    button.disabled = false;
  }
}

byId('start').addEventListener('click', startTest);
byId('resume').addEventListener('click', showQuestion);
byId('latest').addEventListener('click', () => showResult(state.latest));
byId('restart').addEventListener('click', startTest);
byId('share').addEventListener('click', shareResult);

for (const choice of choices) {
  choice.addEventListener('change', () => {
    state.draft.answers[state.draft.index] = Number(choice.value);
    saveState();
    byId('next').disabled = false;
    updateProgress();
  });
}

byId('back').addEventListener('click', () => {
  if (state.draft.index === 0) {
    showWelcome();
    return;
  }
  state.draft.index -= 1;
  saveState();
  showQuestion();
});

byId('next').addEventListener('click', () => {
  const { index, answers } = state.draft;
  if (answers[index] === null) return;
  if (index < questions.length - 1) {
    state.draft.index += 1;
    saveState();
    showQuestion();
    return;
  }
  const unanswered = answers.indexOf(null);
  if (unanswered !== -1) {
    state.draft.index = unanswered;
    saveState();
    showQuestion();
    return;
  }
  state = { draft: null, latest: answers };
  saveState();
  showResult(answers);
});

showWelcome(false);
  </script>
</body>
</html>
